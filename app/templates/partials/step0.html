<!-- ШАГ 1: Источник данных -->
<div class="wizard-step" id="wizardStep0">
    <div class="wizard-card">
        <div class="wizard-step-header">
            <span class="wizard-step-num">1</span>
            <h4 class="wizard-step-title">Источник результатов анкетирования</h4>
            <span class="step-help-icon ms-auto" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Загрузите Excel/CSV-выгрузки или выберите опрос, к отчётам которого у вас есть доступ в ЭИОС."><i class="fa-regular fa-circle-question"></i></span>
        </div>
        <div class="btn-group w-100 mb-3" role="group" aria-label="Источник данных">
            <input type="radio" class="btn-check" name="dataSource" id="dsFiles" value="files" checked>
            <label class="btn btn-outline-primary" for="dsFiles"><i class="fa-solid fa-file-excel me-1"></i>Файлы</label>
            <input type="radio" class="btn-check" name="dataSource" id="dsEios" value="eios">
            <label class="btn btn-outline-primary" for="dsEios"><i class="fa-solid fa-building-columns me-1"></i>ЭИОС</label>
        </div>
        <div id="filesSourcePane">
            <form id="uploadForm">
                <div id="dropZone" class="upload-dropzone">
                    <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3 upload-icon"></i>
                    <p class="upload-title">Перетащите файлы сюда</p>
                    <p class="upload-or">или</p>
                    <label class="btn btn-primary btn-lg px-4 mb-3" for="excelFile">
                        <i class="fa-solid fa-folder-open me-2"></i>Выбрать файлы
                    </label>
                    <input class="d-none" type="file" id="excelFile" accept=".xlsx, .csv" multiple>
                    <p class="text-muted small mb-0">Поддерживаемые форматы: XLSX, CSV</p>
                    <div id="fileListPreview" class="upload-file-list"></div>
                </div>
            </form>
        </div>
        <div id="eiosSourcePane" class="d-none">
            <div id="eiosSurveyLoading" class="text-muted small d-none">
                <span class="spinner-border spinner-border-sm me-2"></span>Загрузка списка опросов…
            </div>
            <div id="eiosSurveyAlert" class="alert d-none"></div>
            <div id="eiosSurveyBlock" class="d-none">
                <div class="fw-bold pb-2"><i class="fa-solid fa-square-poll-vertical me-1"></i>Опрос</div>
                <div class="input-group input-group-sm">
                    <input type="text" class="form-control" id="eiosSurveySearch" placeholder="Поиск опроса...">
                    <button class="btn btn-outline-secondary" type="button" id="eiosSurveySearchClear" tabindex="-1" title="Очистить поиск">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="eiosSurveyList" class="scrollable-box questions-scroll pt-0 pb-0 pr-0 pl-1"></div>
                <div id="eiosSurveyInfo" class="small text-muted mt-2"></div>
            </div>
        </div>
    </div>
</div>
